name: Update FestiChat events

# Rebuilds festivals/events.json on the gh-pages branch (the live site) from
# every configured source, de-duplicated across sources. Optional secrets:
# TICKETMASTER_API_KEY, SEATGEEK_CLIENT_ID. Approved event submissions (issues
# labelled `event-approved`) and scripts/partner-feeds.json are always read.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  pages: write
  issues: read

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'event-approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and merge events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/festivals
          node scripts/fetch-events.mjs site/festivals/events.json

      - name: Publish to gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f festivals/events.json ]; then
            echo "No events from any source yet; nothing to publish."
            exit 0
          fi
          git add festivals/events.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update FestiChat events"
          git push

      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
